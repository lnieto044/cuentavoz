# Blueprint de Render para CuentaVoz: un Web Service (API FastAPI) y un
# Static Site (frontend Vite ya compilado) desplegados por separado, mas la
# base de datos gestionada. Un "Static Site" en Render solo puede servir
# archivos; por eso el backend va como Web Service aparte y el frontend le
# habla por HTTPS via VITE_API_URL. Ver DESPLIEGUE.md para el paso a paso.

databases:
  - name: cuentavoz-db
    plan: free
    databaseName: cuentavoz
    user: cuentavoz

services:
  - type: web
    name: cuentavoz-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: DB_URL
        fromDatabase:
          name: cuentavoz-db
          property: connectionString
      - key: SECRETO_JWT
        generateValue: true
      - key: MINUTOS_TOKEN
        value: "480"
      - key: IDIOMA_VOZ
        value: es-CO
      - key: UMBRAL_ANOMALIA
        value: "0.5"
      - key: MODELO
        value: gemini-flash-latest
      - key: GOOGLE_API_KEY
        sync: false      # se pega a mano en el dashboard: la llave es secreta
      - key: ORIGEN_PERMITIDO
        sync: false      # URL del static site una vez exista, ver DESPLIEGUE.md
      - key: WEBAUTHN_RP_ID
        sync: false      # dominio del static site SIN esquema ni puerto, ver DESPLIEGUE.md
      - key: WEBAUTHN_RP_NAME
        value: CuentaVoz
      - key: WEBAUTHN_ORIGENES
        sync: false      # URL completa del static site (con https://), ver DESPLIEGUE.md

  - type: web
    name: cuentavoz-web
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false      # URL del cuentavoz-api una vez exista, ver DESPLIEGUE.md
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
