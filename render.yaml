# Blueprint de Render para CuentaVoz: un Web Service (API FastAPI) y un
# Static Site (frontend Vite ya compilado) desplegados por separado, mas la
# base de datos gestionada. Un "Static Site" en Render solo puede servir
# archivos; por eso el backend va como Web Service aparte y el frontend le
# habla por HTTPS via VITE_API_URL. Ver DESPLIEGUE.md para el paso a paso.

databases:
  - name: cuentavoz-db
    plan: free
    databaseName: cuentavoz
    user: cuentavoz

services:
  - type: web
    name: cuentavoz-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"     # sin esto Render usa Python 3.13, donde rapidfuzz
                            # no tiene wheel precompilado y falla al compilar
      - key: DB_URL
        fromDatabase:
          name: cuentavoz-db
          property: connectionString
      # Identidad con AWS Cognito - el User Pool/App Client se crean una
      # sola vez desde la cuenta de AWS del equipo (ver DESPLIEGUE.md);
      # las credenciales de AWS_* son las de la cuenta IAM propia del
      # backend (cuentavoz-backend), no la de aprovisionamiento.
      - key: COGNITO_REGION
        value: us-east-2
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_APP_CLIENT_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Crea luis/diana/stephanie/valentina (clave StockXperts1, publicada
      # en el README) si la base de usuarios esta vacia - activo a
      # proposito para que cualquiera entre facil en la demo del
      # hackathon. Despues del hackathon, si este mismo servicio pasa a
      # usarse con datos reales, quite esta linea (o pongala en "0") para
      # que esas cuentas de prueba no queden accesibles con una clave
      # publica.
      - key: SEMBRAR_DEMO
        value: "1"
      - key: IDIOMA_VOZ
        value: es-CO
      - key: UMBRAL_ANOMALIA
        value: "0.5"
      - key: MODELO
        value: gemini-flash-latest
      - key: GOOGLE_API_KEY
        sync: false      # se pega a mano en el dashboard: la llave es secreta
      - key: ORIGEN_PERMITIDO
        sync: false      # URL del static site una vez exista, ver DESPLIEGUE.md
      - key: SENTRY_DSN
        sync: false      # opcional - monitoreo de errores, ver DESPLIEGUE.md

  - type: web
    name: cuentavoz
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false      # URL del cuentavoz-api una vez exista, ver DESPLIEGUE.md
      - key: VITE_SENTRY_DSN
        sync: false      # opcional - version frontend del DSN de arriba
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
