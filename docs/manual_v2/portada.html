<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada · Manual CuentaVoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&display=swap">
<style>
  :root{
    --navy:#10294C;
    --amarillo:#FFD000;
    --display:"Barlow","Segoe UI",system-ui,sans-serif;
    --cuerpo:"Source Serif 4",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  @page{ size:A4; margin:0; }
  html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  body{
    width:210mm; height:297mm;
    background:var(--navy); color:#fff;
    font-family:var(--cuerpo);
    padding:26mm 22mm 22mm;
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }

  /* franja vertical amarilla al canto derecho, a sangre */
  body::after{
    content:""; position:absolute; top:0; right:0;
    width:9mm; height:100%; background:var(--amarillo);
  }

  .marca{ display:flex; align-items:center; gap:12px; }
  .marca img{ width:46px; height:46px; border-radius:12px; }
  .marca b{
    font-family:var(--display); font-size:20pt; font-weight:700;
    letter-spacing:-.012em; line-height:1; display:block;
  }
  .marca span{
    display:block; font-family:var(--display); font-size:9pt;
    font-style:italic; color:#9DB6D4; letter-spacing:.02em; margin-top:2px;
  }

  .regla{ width:70px; height:5px; background:var(--amarillo); margin:38mm 0 10mm; border-radius:3px; }

  h1{
    font-family:var(--display); font-weight:700; font-size:44pt;
    line-height:1.0; letter-spacing:-.024em; max-width:13ch;
  }
  .bajada{
    font-size:13.5pt; color:#C3D5E9; margin-top:8mm;
    max-width:32ch; line-height:1.5;
  }

  .pie{ margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; gap:16mm; }
  .meta{
    font-family:var(--display); font-size:8.6pt; letter-spacing:.1em;
    text-transform:uppercase; color:#8FA9C8; line-height:2.05;
  }
  .meta b{ color:#fff; font-weight:600; letter-spacing:.075em; }
  .cliente{ text-align:right; padding-right:4mm; }
  .cliente img{ width:128px; display:block; margin-left:auto; }
  .cliente p{
    font-family:var(--display); font-size:8pt; letter-spacing:.09em;
    text-transform:uppercase; color:#8FA9C8; margin-top:8px;
  }
</style>
</head>
<body>
  <div class="marca">
    <img src="../../frontend/public/logo.png" alt="">
    <div>
      <b>CuentaVoz</b>
      <span>Tu voz cuenta</span>
    </div>
  </div>

  <div class="regla"></div>
  <h1>Manual de usuario</h1>
  <p class="bajada">Guía práctica para la captura de inventarios por voz en las bodegas de Colsubsidio.</p>

  <div class="pie">
    <div class="meta">
      Versión <b>2.0</b><br>
      Agosto de 2026<br>
      Dirigido a <b>auxiliares de inventarios<br>y administradores de bodega</b>
    </div>
    <div class="cliente">
      <img src="../../frontend/public/colsubsidio-color.png" alt="Colsubsidio">
      <p>Preparado por StockXperts</p>
    </div>
  </div>
</body>
</html>
